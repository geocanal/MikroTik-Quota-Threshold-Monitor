apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: campaign-postgres:5432
    database: campaign_db
    user: campaign
    secureJsonData:
      password: password
    jsonData:
      database: campaign_db
      sslmode: "disable"
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1400
      timescaledb: false
    isDefault: true
    editable: true
