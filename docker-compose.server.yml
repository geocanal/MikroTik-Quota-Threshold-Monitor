services:
  grafana:
    image: grafana/grafana:latest
    container_name: mikrotik-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - DB_HOST=app-postgres-1
      - DB_PORT=5432
      - DB_NAME=campaign_db
      - DB_USER=campaign
      - DB_PASSWORD=password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/dashboards/mikrotik-overview.json:/var/lib/grafana/dashboards/mikrotik-overview.json:ro
      - ./provisioning/dashboards/hotspot-overview.json:/var/lib/grafana/dashboards/hotspot-overview.json:ro
    networks:
      - app_network
      - n8n_network

volumes:
  grafana_data:
    driver: local

networks:
  app_network:
    name: app_default
    external: true
  n8n_network:
    name: n8n_n8n
    external: true
